# =============================================================================
# Echo-LongVideo Multishot Inference Configuration
#
# Used by: python inference.py --config configs/inference.yaml
# Command-line arguments override values in this file.
# =============================================================================

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
env:
  venv_path: .venv

# ---------------------------------------------------------------------------
# Paths (relative paths are resolved from repository root)
# ---------------------------------------------------------------------------
paths:
  checkpoint: checkpoints/test.safetensors
  gemma_path: checkpoints/gemma-3-12b
  # Optional: language-model-only Gemma3 GGUF (e.g. Q4_0). Set this to cut the
  # text encoder's peak VRAM from ~24GB (full bf16, OOMs on 24GB-class GPUs) to
  # ~13GB by requantizing to NF4 on load. gemma_path above is still required --
  # tokenizer/processor files come from there, not from the GGUF.
  # Quality note: NF4 is a different scheme than the GGUF's QAT-trained Q4_0,
  # so some of that QAT-specific quality benefit is traded away.
  # gemma_gguf_path: checkpoints/gemma-3-12b-it-q4_0.gguf
  prompts_dir: prompts
  prompts_glob: "*.json"
  output_root: inference_result/outputs

# ---------------------------------------------------------------------------
# Video / generation settings
# ---------------------------------------------------------------------------
video:
  num_frames: 241
  height: 736
  width: 1280
  fps: 25
  seed: 12345

# ---------------------------------------------------------------------------
# Denoising schedule
# ---------------------------------------------------------------------------
denoising:
  steps: 
      - 1000
      - 994
      - 988
      - 981
      - 975
      - 909
      - 725
      - 422
      - 0
  sigmas:   
      - 1.0
      - 0.99375
      - 0.9875
      - 0.98125
      - 0.975
      - 0.909375
      - 0.725
      - 0.421875
      - 0.0

# ---------------------------------------------------------------------------
# Memory bank (paired audio-video memory)
# ---------------------------------------------------------------------------
memory:
  max_size: 7
  num_fix_frames: 3
  downscale_factor: 1
  position_mode: reference
  lora_strength: 1.0
  lora_generator: true
  lora_path: ""
  save_mode: random_every_shot_frame
  frame_selection_mode: center
  clip_num_frames: 9

# ---------------------------------------------------------------------------
# Audio memory
# ---------------------------------------------------------------------------
audio_memory:
  enable: true
  window_size: 96
  window_selection_mode: max_response
  sample_rate: 16000
  mel_bins: 128
  mel_hop_length: 160
  n_fft: 1024
  downsample_factor: 4
  is_causal: true

# ---------------------------------------------------------------------------
# Inference runtime
# ---------------------------------------------------------------------------
inference:
  device: cuda
  dtype: bfloat16
  v2a_grad_scale: 2.0
  # FP8-quantize the generator transformer's weights on load. Off by default --
  # changes numerical precision, unverified quality/speed impact on this model.
  # Goal is VRAM reduction (opens cheaper GPU tiers), not necessarily speed.
  quantization_fp8_enabled: false

  # Stream transformer blocks CPU->GPU one at a time instead of keeping all 48
  # resident. The generator's weights and its activations compete for the same
  # VRAM: at ~18.1GB fp8 on a 22GB card only ~2.3GB is left, and the AdaLN
  # projection alone needs tokens*9*4096*2 bytes (3.98GB at 497 frames /
  # 736x1280). This drops block residency to ~1/48th, freeing ~17GB.
  # Cost is one H2D copy per block per forward pass: a constant ~40-65ms per
  # block against per-block compute that scales with token count -- ~3%
  # overhead at 58k tokens, but >100% below ~3k tokens. Enable only when VRAM
  # actually forces it; small videos are transfer-bound and fit anyway.
  sequential_offload_enabled: false

# ---------------------------------------------------------------------------
# Video VAE decode tiling (opt-in perf experiment -- see inference.py)
# Splits the single monolithic decoder forward pass into smaller spatial/
# temporal tiles blended back together, instead of one full-resolution call.
# ---------------------------------------------------------------------------
decode:
  tiled_decode_enabled: true
  tile_size_frames: 32
  tile_overlap_frames: 8
  tile_size_px: 512
  tile_overlap_px: 64
